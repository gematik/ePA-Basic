openapi: 3.0.1
info:
  title: I_Ehr_Information_Service
  description: |-
    This interface provides information for the localization of a health record/ health record system and about relevant 
    consent decision associated to a health record.<br/>
    This interface is also used to collect the client experience values for several use case.<br/>

    **General conditions**:<br> 
    For all operations if applicable:
    - a section _Client_ in operation descriptions covers recommendations (informative) for clients.
    - a section _Provider_ in operation descriptions covers requirements for the server side. 

    **Prerequisites**:<br>
    These interface operations require a VAU channel and an authenticated client (user session), but do 
    not require a valid authorization.

    **Retry interval**:<br>
    The following retry intervals are suggested in case of an error response:<br>
    - '500' Internal Error
      - approx. 10 minutes

    **User Agent**.<br>
    The user agent information (x-useragent) is part of any request, even if 
    not essentially required for the operation (e.g. raw-data collection), and
    may be considered for provider internal use. 

    **Request ID**:<br>
    Clients may provide a unique request identifier (X-Request-ID) with each request. 
    Given such a request identifier, providers must 
    - echo the exact same X-Request-ID value in the response header.
    - log the X-Request-ID in all operational logs related to that request.

  version: 1.0.0

  # version history:
  # ----------------
  # version 1.0.0
  #   - establish Information Service operations mandating a VAU-channel and user session for access.

  contact:
    name: gematik GmbH
    url: 'http://www.gematik.de'
  license:
    name: Apache 2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0"

servers:
  - url: https://epa-hst1.prod.epa4all.de

tags:
  - name: AccountInformation
    description: |
     Check if a specific health record is provided by the adressed health record system.
     
  - name: ConsentDecisions
    description: |
     Consent decision information for healthcare institutions and backends (ePrescription).

  - name: UserExperience
    description: |
     User experience data collection for healthcare institutions.<br>
     (May also be used for ePA-FdV data collection)

paths:
  /information/api/v2/ehr:
    parameters:
      - $ref: '#/components/parameters/insurantid'
      - $ref: '#/components/parameters/useragent'
      - $ref: '#/components/parameters/requestid'
    get:
      tags:
        - AccountInformation
      operationId: getRecordStatusV2
      summary: (getRecordStatusV2) Check if a specific health record exists.
      description: |
       Check the health record system for an existing health record matching _insurantid_.

       This operation shall be used to locate the health record system and a particular health record.
        
       ### Provider
       | Conditions | Status code | Error code | Remarks |
       |------------|-------------|------------|---------|
       | Health record exists and is in state ACTIVATED | 204 |||
       | Request does not match schema | 400 | malformedRequest ||
       | Health record does not exist (UNKNOWN) or is in state INITIALIZED | 404 | noHealthRecord | _insurantid_ unknown |
       | Health record is not in state ACTIVATED (i.e. is in state SUSPENDED or INACCESSIBLE) | 409 | statusMismatch | (see 'Retry interval') |
       | Any other error | 500 | internalError | (see 'Retry interval') |

      responses:
        '204':
          description: Ok. Record exists.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
        '400':
          $ref: '#/components/responses/Error400BadRequest'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: "#/components/responses/Error404NotFound"
        '500':
          $ref: "#/components/responses/Error500InternalError"


  /information/api/v2/ehr/consentdecisions:
    parameters:
      - $ref: '#/components/parameters/insurantid'
      - $ref: '#/components/parameters/useragent'
      - $ref: '#/components/parameters/requestid'
    get:
      tags:
        - ConsentDecisions
      operationId: getConsentDecisionInformationV2
      summary: (getConsentDecisionInformationV2) Get current healthcare process relevant consent decisions
      description: |
       Get current decisions about consent related functions with associated healthcare processes.<br>
        
       This operation may be invoked prior to a login to the addressed health record. <br>
       The current decisions may be evaluated for operational use by a client.<br>
        
       ### Provider
       The response shall cover decisions with consent class "healthCareProcess" only as prepared by Consent 
       Decision Management for information.

       | Conditions | Status code | Error code | Remarks |
       |------------|-------------|------------|---------|
       | Successful operation | 200 |||
       | Request does not match schema | 400 | malformedRequest ||
       | Requestor not authorized | 403 | invalAuth | no user session with valid ID-Token available |
       | Health record does not exist (UNKNOWN) or is in state INITIALIZED | 404 | noHealthRecord | |
       | Health record is in state SUSPENDED or INACCESSIBLE| 409 | statusMismatch | Retry interval approx 24 hours |
       | Any other error | 500 | internalError | (see 'Retry interval') |

       <br>
       | Postconditions                        | Remarks |
       |---------------------------------------|---------|
       | The raw-data of the operation is collected and associated to _useragent_ | for any operation result according to gemSpec_Perf UC_A3.9 |

      responses:
        '200':
          description: Ok.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
          content:
            application/json:
              example:
                data:
                  - functionId: "medication"
                    decision: "deny"
                  - functionId: "erp-submission"
                    decision: "permit"
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentDecisionsResponseType"
        '400':
          $ref: '#/components/responses/Error400BadRequest'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: "#/components/responses/Error404NotFound"
        '409':
          $ref: "#/components/responses/Error409Conflict"
        '500':
          $ref: "#/components/responses/Error500InternalError"

  /information/api/v2/userexperience:
    parameters:
      - $ref: '#/components/parameters/useragent'
      - $ref: '#/components/parameters/requestid'
    post:
      tags:
        - UserExperience
      operationId: setUserExperienceResultV2
      summary: (setUserExperienceResultV2) provide measurement for ux use cases
      description: |
       Provide measurements for ux use cases.<br>
        
       This operation may be invoked without login to any health record. <br>
       Clients of health care institutions shall onlyuse the use case identifiers:
        - UX_Login_PS
        - UX_Doc_Upload_PS
        - UX_Doc_Download_PS
        - UX_MHD_Search_PS
        - UX_MHD_Download_PS
        - UX_Login_V
        - UX_Doc_Upload_V
        - UX_Doc_Download_V
        - UX_MHD_Search_V
        - UX_MHD_Download_V
        - UX_LEI_search       
       
       
       ### Provider
       The use case measurements shall be associated to _useragent_ and collected, 
       processed and distributed according requirements defined in specification gemSpec_Perf

       | Conditions | Status code | Error code | Remarks |
       |------------|-------------|------------|---------|
       | Successful operation | 204 |||
       | Request does not match schema | 400 | malformedRequest ||
       | Requestor not authorized | 403 | invalAuth | no user session with valid ID-Token available |
       | Any other error | 500 | internalError | (see 'Retry interval') |

       <br>
       | Postconditions                        | Remarks |
       |---------------------------------------|---------|
       | data collected ||

      requestBody:
        required: true
        content:
          application/json:
            example:
              useCase: "UX_Doc_Upload_PS"
              measurement: 1299
            schema:
              $ref: "#/components/schemas/UxRequestType"
      responses:
        '204':
          description: Ok. Data collected
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
        '400':
          $ref: '#/components/responses/Error400BadRequest'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '500':
          $ref: "#/components/responses/Error500InternalError"

components:
  headers:
    requestid:
      description: Request identifier as provided by the client.
      schema:
       $ref: '#/components/schemas/RequestIdType'
  parameters:
    insurantid:
      name: x-insurantid
      in: header
      description: Health Record Identifier.
      required: true
      schema:
        $ref: '#/components/schemas/InsurantIdType'
    useragent:
      name: x-useragent
      in: header
      description: user agent information
      required: true
      schema:
        $ref: '#/components/schemas/UserAgentType'
    requestid:
      name: X-Request-ID
      in: header
      description: request identifier
      schema:
        $ref: '#/components/schemas/RequestIdType'

  responses:
    Error400BadRequest:
      description: Bad Request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          example:
            errorCode: malformedRequest
          schema:
            $ref: '#/components/schemas/ErrorType'
    Error403Forbidden:
      description: Forbidden.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          example:
            errorCode: invalAuth
          schema:
            $ref: '#/components/schemas/ErrorType'
    Error404NotFound:
      description: Not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          example:
            errorCode: noHealthRecord
          schema:
            $ref: '#/components/schemas/ErrorType'
    Error409Conflict:
      description: Conflict.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          examples:
            statusMismatch:
              value:
                errorCode: statusMismatch
          schema:
            $ref: '#/components/schemas/ErrorType'
    Error500InternalError:
      description: Internal Server Error
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          example:
            errorCode: internalError
          schema:
            $ref: '#/components/schemas/ErrorType'

  schemas:
    ConsentDecisionsResponseType:
      description: "Consent Decisions Response"
      type: object
      properties:
        functionId:
          $ref: '#/components/schemas/FunctionIdType'
        decision:
          type: string
          enum: ["permit", "deny"]
          description: "Decision"
      required:
        - functionId
        - decision
      example:
        functionId: "medication"
        decision: "deny"
    FunctionIdType:
      type: string
      description: function id of consent related functions of a health record.
    InsurantIdType:
      type: string
      description: |-
        The health record identifier. 
        For today the record identifier equals the insurant id (kvnr). The record identifier does not include any home community id.
      pattern: '^[A-Z]{1}\d{9}$'
      example: Z123456789
    UserAgentType:
      description: "Information about client software with: ClientId(20 characters) + / + VersionNumber (1 to 15 characters)."
      type: string
      pattern: '^[a-zA-Z0-9\-]{1,20}\/[a-zA-Z0-9\-\.]{1,15}$'
      example: CLIENTID1234567890AB/2.1.12-45
    RequestIdType:
      type: string
      format: uuid
      description: "Unique identifier of the request"
      example: "f4411e89-2eca-405c-88a1-7ee20b9b6e3c"
    UxRequestType:
      type: object
      properties:
        useCase:
          description: Use case identifier
          type: string
          enum:
            - UX_Login_PS
            - UX_Doc_Upload_PS
            - UX_Doc_Download_PS
            - UX_MHD_Search_PS
            - UX_MHD_Download_PS
            - UX_Login_V
            - UX_Doc_Upload_V
            - UX_Doc_Download_V
            - UX_MHD_Search_V
            - UX_MHD_Download_V
            - UX_LEI_search
        measurement:
          description: Use case execution time in milliseconds
          type: integer
      required:
        - useCase
        - measurement
    ErrorType:
      description: "Error object with additional information about the occurred error"
      type: object
      properties:
        errorCode:
          description: "Error condition specifier"
          type: string
        errorDetail:
          description: "Additional details regarding the error condition"
          type: string
      required:
        - errorCode
