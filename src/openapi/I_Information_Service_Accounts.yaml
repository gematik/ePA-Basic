openapi: 3.0.1
info:
  title: I_Information_Service_Accounts
  description: |-
    This interface provides operations for either health record relocation or health record merge
    among different Electronic Health Record System providers.<br/>

    **General conditions**:</br> 
    For all operations if applicable:
    - a section _Client_ in operation descriptions covers recommendations (informative) for clients.
    - a section _Provider_ in operation descriptions covers requirements for the server side. 

    **Prerequisites**:</br>
    This interface does not require a VAU channel/ user session or entitlements but a mutual 
    TLS connection instead.

    **Retry interval**:</br>
    Operation responses '409' Conflict and '500' Internal Error indicate temporary states.
    A retry may apply after a suitable period of waiting time. 

    **Request ID**:</br>
    Clients may provide a unique request identifier (X-Request-ID) with each request. 
    Given such a request identifier, providers must 
    - echo the exact same X-Request-ID value in the response header.
    - log the X-Request-ID in all operational logs related to that request.

    This _X-Request-ID_ for monitoring purposes should not be confused with the _requestId_
    used to identify relocation- or merge-sessions! 

  version: 1.8.0

