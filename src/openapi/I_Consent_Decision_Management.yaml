    PurposeType:
      type: object
      properties:
        decision:
          type: string
          enum: ["permit", "deny"]
      required:
        - decision
    PurposeResponseType:
      allOf:
        - $ref: '#/components/schemas/PurposeType'
        - type: object
          properties:
            issued:
              type: object
              properties:
                at:
                  description: Timestamp of the last change of the consent decision
                  type: string
                  format: date-time
                actorId:
                  description: "Telematik-ID or KVNR. In case of displayName equals _system_: actorId is not required but if provided, Telematik-ID of insurance company shall be used."
                  $ref: '#/components/schemas/ActorIdType'
                displayName:
                  $ref: '#/components/schemas/DisplayNameType'          
              required:
                - at
                - displayName

    UdpMedicationResponseType:
      allOf:
        - $ref: '#/components/schemas/UdPMedicationAssignmentType'
        - type: object
          properties:
            at:
              description: Creation timestamp
              type: string
              format: date-time
          required:
            - at
    UdPMedicationAssignmentType:
      description: Properties of one specific user
      type: object
      required:
        - actorId
        - oid
        - displayName
      properties:
        actorId:
          $ref: '#/components/schemas/TelematikIdType'
        oid:
          $ref: '#/components/schemas/OidType'
        displayName:
          $ref: '#/components/schemas/DisplayNameType'

    UserAgentType:
      description: "Information about client software with: ClientId(20 characters) + / + VersionNumber (1 to 15 characters)."
      type: string
      pattern: '^[a-zA-Z0-9\-]{1,20}\/[a-zA-Z0-9\-\.]{1,15}$'
      example: CLIENTID1234567890AB/2.1.12-45
    FunctionIdType:
      type: string
      description: Function id of consent related functions of a health record.
    InsurantIdType:
      type: string
      description: |-
        The health record identifier. 
        For today the record identifier equals the insurant id (kvnr).
      pattern: '^[A-Z]{1}\d{9}$'
      example: Z123456789
    RequestIdType:
      type: string
      format: uuid
      description: "Unique identifier of the request"
      example: "f4411e89-2eca-405c-88a1-7ee20b9b6e3c"    
    ActorIdType:
      description: Identifier of an actor (kvnr or telematik-id)
      oneOf:
        - $ref: '#/components/schemas/KvnrType'
        - $ref: '#/components/schemas/TelematikIdType'
    KvnrType:
      type: string
      pattern: '^[A-Z]{1}\d{9}$'
      example: Z123456789
    TelematikIdType:
      type: string
      pattern: '^[1-9][0-9]?-[\x21-\x7E]+$'
      maxLength: 128
      example: 2-883110000118994
    OidType:
      description: A professionOID
      type: string
      pattern: '([0-2])((\.0)|(\.[1-9][0-9]*))*$'
      example: '1.2.276.0.76.4.50'
    DisplayNameType:
      description: A readable name
      type: string
      example: 'Praxis Dr. Annamaria Heckhausén'

    ErrorType:
      description: "Error object with additional information about the occurred error"
      type: object
      properties:
        errorCode:
          description: "Error condition specifier"
          type: string
        errorDetail:
          description: "Additional details regarding the error condition"
          type: string
      required:
        - errorCode
