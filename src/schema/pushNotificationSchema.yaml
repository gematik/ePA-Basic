# version history:
# ----------------
# version 1.1.0
#   - rename channelIds removing xds and add path for ePA (e.g., epa.document.update)
#   - add content for title and documentId to a new document or update a document (document.put, document.update)
# version 1.0.1
#   - the filling of docId is changed from DocumentEntry.uniqueId to DocumentEntry.entryUUID
# version 1.0.0
#   - first release version

$schema: 'http://json-schema.org/draft-07/schema#'
type: object
properties:
  pushContent:
    type: object
    oneOf:
      - $ref: '#/definitions/documentPut'
      - $ref: '#/definitions/documentUpdate'
      - $ref: '#/definitions/entitlePut'
      - $ref: '#/definitions/entitlePs'
      - $ref: '#/definitions/entitleDel'
      - $ref: '#/definitions/constraintDel'
required:
  - pushContent

definitions:
  pushContentItem:
    type: object
    properties:
      channelId:
        description: Channel that triggered the push notification.
        type: string
      when:
        description: Timestamp of event that triggered the push notification
        type: string
        format: date-time
      actor:
        description: Readable name of the user who triggered the push notification; _display_name_ of ID-Token of user session
        type: string
      insurantId:
        type: string
        description: The health record identifier. For today the record identifier equals the insurant id (kvnr).
        pattern: '^[A-Z]{1}\d{9}$'
        example: Z123456789    
    required:
      - channelId
      - when
      - actor
      - insurantId

  documentPut:
    description: |
      Data structure of channel to upload a new document to the Health Record System;
      triggered by operation ProvideAndRegisterDocumentSet-b of XDS document service;
      triggered by Generate-Metadata-Transaktion of the MHD service;
      triggered by Simplified-Publish-Transaktion of the MHD Service
    allOf:
      - $ref: '#/definitions/pushContentItem'
      - type: object
        properties:
          channelId:
            const: 'epa.document.put'
          title:
            description: |
              XDS: title of the document according to metadata DocumentEntry.title
              MHD: DocumentReference.content.attachment.title
            type: string
          docId:
            description: |
              XDS: Identifier of the document according to metadata DocumentEntry.entryUUID
              MHD: DocumentReference.id
            type: string
        required:
          - title
          - docId

  documentUpdate:
    description: |
      Data structure of channel to update an existing document to the Health Record System;
      triggered by operation ProvideAndRegisterDocumentSet-b of XDS document service;
      triggered by Generate-Metadata-Transaktion of the MHD service;
      triggered by Simplified-Publish-Transaktion of the MHD Service
    allOf:
      - $ref: '#/definitions/pushContentItem'
      - type: object
        properties:
          channelId:
            const: 'epa.document.update'
          title:
            description: |
              XDS: title of the document according to metadata DocumentEntry.title
              MHD: DocumentReference.content.attachment.title
            type: string
          docId:
            description: |
              XDS: Identifier of the document according to metadata DocumentEntry.entryUUID
              MHD: DocumentReference.id
            type: string
        required:
          - title
          - docId

  entitlePut:
    description: data structure of channel to add an entitlement done by representative using FdV
    allOf:
      - $ref: '#/definitions/pushContentItem'
      - type: object
        properties:
          channelId:
            const: 'epa.entitle.put'
          who:
            description: displayName of entitlement to describe who is entitled, e.g. LEI, DiGA
            type: string
          oid:
            description: oid of entitlement; value of professionOID
            type: string
          validTo:
            description: validTo of entitlement; Expiry date-time of entitlement in format according to rfc3339
            type: string
            format: date-time
        required:
          - who
          - oid
          - validTo

  entitlePs:
    description: data structure of channel to add an entitlement done by LEI using operation setEntitlementPs
    allOf:
      - $ref: '#/definitions/pushContentItem'
      - type: object
        properties:
          channelId:
            const: 'epa.entitle.ps'
          who:
            description: displayName of entitlement to describe who is entitled
            type: string
          oid:
            description: oid of entitlement; value of professionOID
            type: string
          validTo:
            description: validTo of entitlement; Expiry date-time of entitlement in format according to rfc3339
            type: string
            format: date-time
        required:
          - who
          - oid
          - validTo

  entitleDel:
    description: data structure of channel to delete an entitlement done by representative using FdV
    allOf:
      - $ref: '#/definitions/pushContentItem'
      - type: object
        properties:
          channelId:
            const: 'epa.entitle.del'
          who:
            description: displayName of entitlement to describe who was entitled
            type: string
          oid:
            description: oid of entitlement; value of professionOID
            type: string
          validTo:
            description: validTo of entitlement; Expiry date-time of entitlement in format according to rfc3339
            type: string
            format: date-time
        required:
          - who
          - oid
          - validTo

  constraintDel:
    description: |
      data structure of channel to undo (make it visible again) a restricted document or category or folder; 
      means deleting constraint in general deny policiy of a health record; 
      done by representative using FdV
    allOf:
      - $ref: '#/definitions/pushContentItem'
      - type: object
        properties:
          channelId:
            const: 'epa.constraint.del'
        oneOf:
          - type: object
            properties:
              title:
                description: |
                  title of the document which is now visible (was hidden before) according to metadata DocumentEntry.title
                  of approved document
                type: string
              docId:
                description: |
                  Identifier of the document according to metadata DocumentEntry.entryUUID;
                  rootDocumentId of deleted entry of general deny policy references the document
                type: string
            required:
              - title
              - docId

          - type: object
            properties:
              categoryId:
                description: categoryId of deleted entry of general deny policy
                type: string
            required:
              - categoryId

          - type: object
            properties:
              folderTitle:
                type: string
              folderCode:
                description: Metadata folder.folderCode of the dynamic folder that is now visible and was hidden before
                type: string
              folderUuid:
                description: folderUUID of deleted entry of general deny policy
                type: string
            required:
              - folderTitle
              - folderCode
              - folderUuid